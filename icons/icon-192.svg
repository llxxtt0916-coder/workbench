<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4f7df3"/>
      <stop offset="100%" stop-color="#3b6bde"/>
    </linearGradient>
  </defs>
  <!-- Background rounded square -->
  <rect x="12" y="12" width="168" height="168" rx="32" ry="32" fill="url(#bg)"/>
  <!-- Clipboard body -->
  <rect x="52" y="42" width="88" height="108" rx="10" ry="10" fill="white" opacity="0.95"/>
  <!-- Clipboard header -->
  <rect x="68" y="30" width="56" height="24" rx="8" ry="8" fill="white" opacity="0.95"/>
  <!-- Checkmark -->
